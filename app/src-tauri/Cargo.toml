[package]
name = "halation"
version = "0.1.0"
description = "Film grain, halation, bloom and damage editor for Lightroom Classic"
authors = ["Halation contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "halation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
