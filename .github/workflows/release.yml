# Cut a GitHub release when a v* tag is pushed:
#   1. zip the Lightroom plug-in and create the release with notes from docs/releases/<tag>.md
#   2. build the Tauri desktop app on macOS (arm64 + x64) and Windows and attach the bundles
#
# To release:  git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plugin:
    name: Plug-in and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the Lightroom plug-in
        run: |
          cd plugin
          zip -r "../Halation.lrplugin-${GITHUB_REF_NAME#v}.zip" Halation.lrplugin

      - name: Pick release notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" notes.md
          else
            echo "Halation ${GITHUB_REF_NAME}" > notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halation ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          files: Halation.lrplugin-*.zip

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build and attach bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Halation ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}
